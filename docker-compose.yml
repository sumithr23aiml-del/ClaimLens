services:

  postgres:
    image: postgres:16
    container_name: claimlens-postgres
    environment:
      POSTGRES_DB: claimlens
      POSTGRES_USER: claimlens
      POSTGRES_PASSWORD: claimlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimlens -d claimlens"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: claimlens-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: claimlens-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: claimlens
      MINIO_ROOT_PASSWORD: claimlens123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: claimlens-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set claimlens http://minio:9000 claimlens claimlens123;
      mc mb --ignore-existing claimlens/claims;
      mc mb --ignore-existing claimlens/artifacts;
      exit 0;
      "

  qdrant:
    image: qdrant/qdrant:latest
    container_name: claimlens-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    

  tika:
    image: apache/tika:latest
    container_name: claimlens-tika
    ports:
      - "9998:9998"
    
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.1
    container_name: claimlens-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/');"]    
      interval: 10s
      timeout: 5s
      retries: 10


volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  mlflow_data: